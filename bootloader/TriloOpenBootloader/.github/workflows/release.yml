name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-matrix:
    name: Release Build - ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        preset:
          - FTS
          - TOOL_CONTROL
          - J3_4_CONTROL
          - J2_CONTROL
          - J1_CONTROL
          - LED
          - DECK_SLOT
          - INTERMODULARITY
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ARM toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi ninja-build

      - name: Build Release - ${{ matrix.preset }}
        run: |
          cmake --preset ${{ matrix.preset }}-Release -DFIRMWARE_VERSION=${{ github.ref_name }}
          cmake --build build/${{ matrix.preset }}-Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}-Release/TriloOpenBootloader-*.hex
            build/${{ matrix.preset }}-Release/TriloOpenBootloader-*.bin

  release:
    name: Create GitHub Release
    needs: release-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize binaries
        run: |
          mkdir -p release-binaries
          # Copy all .bin and .hex files to a single directory
          find release-artifacts -type f \( -name "*.bin" -o -name "*.hex" \) -exec cp {} release-binaries/ \;
          ls -lah release-binaries/

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
