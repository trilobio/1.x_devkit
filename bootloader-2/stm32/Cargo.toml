[package]
name = "ezfdbootloader-device"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32h523ce", "memory-x", "time-driver-any", "exti", "unstable-pac"] }
embassy-sync = { version = "0.8.0"}
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1"}

embassy-futures = { version = "0.1.2" }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0" }
embedded-io-async = { version = "0.7.0" }
panic-probe = { version = "1.0.0" }
critical-section = "1.2"
# --------------
embedded-can = "0.4.1"
rtt-target = "0.6.2"


# cyw43 = { version = "0.7.0", features = ["defmt"] }
# defmt = "1.1.0"
# defmt-rtt = "1.2.0"
# embedded-nal-async = "0.9.0"
# heapless = { version = "0.9", default-features = false }
# embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
# embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", "proto-ipv6"] }
# embassy-usb = { version = "0.6.0", features = ["defmt"] }
# micromath = "2.1.0"
# stm32-fmc = "0.4.0"
# dsp-fixedpoint = { version = "0.1.1", default-features = false }
# embedded-storage = "0.3.1"
# static_cell = "2"





# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

[package.metadata.embassy]
build = [
    { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/stm32h5" }
]
